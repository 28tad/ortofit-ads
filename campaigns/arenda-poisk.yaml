  - name: "Голеностоп"
    id: 5785929112
    max_cpc: 60
    negative_keywords: *negatives
    autotargeting:
      target_queries: true
      narrow_queries: true
      own_brand_queries: true
      broad_queries: false
      accessory_queries: false
      alternative_queries: false
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - артромот сп3 аренда
      - artromot sp3 аренда
      - артромот для голеностопного сустава аренда
      # «Лодыжку» люди тоже спрашивают: 10 августа был запрос
      # «артромот для лодыжки напрокат в самаре».
      - артромот для лодыжки аренда
      - аппарат для разработки голеностопного сустава аренда
      - артромот для голеностопа прокат
