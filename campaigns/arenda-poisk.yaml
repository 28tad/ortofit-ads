# Кампания заведена в Директе вручную; здесь она описана для версионирования и
# для будущей записи через API. ID реальных объектов заданы полями id, а не
# комментариями: по ним скрипт сопоставляет описание с аккаунтом — из коммента
# он бы их не прочитал.
#
# Тексты подчинены требованиям Яндекса к рекламе медицинских изделий:
# https://yandex.ru/support/direct/ru/moderation/categories/medicine-medical-devices
# Предупреждение «Есть противопоказания. Посоветуйтесь с врачом» Директ
# добавляет в текстовые объявления сам — в тексты его вписывать не нужно.

# Общий список минус-фраз. В Единой перфоманс-кампании минус-фразы задаются на
# уровне группы, общего списка на кампанию нет — поэтому один и тот же набор
# подставляется в каждую группу якорем, а не дублируется трижды.
negative_keywords: &negatives
  - упражнения
  - гимнастика
  - лфк
  - зарядка
  - симптомы
  - лечение
  - болит
  - отек
  - мазь
  - уколы
  - таблетки
  - омс
  - квота
  - бесплатно
  - инвалидность
  - больничный
  - операция
  - артроскопия
  - эндопротезирование
  - хирург
  - клиника
  - больница
  - санаторий
  - отзывы
  - форум
  - stoller
  - мрт
  - протез
  - имплант
  - наколенник
  - ортез
  - костыли
  - диета
  - наркоз

campaign:
  # Сопоставление с аккаунтом идёт по id, а не по имени: Директ назвал кампанию
  # сам — «Единая перфоманс-кампания №2 от 09-08-2026», — и по имени скрипт её
  # не находил. Имя ниже желаемое; переименовать в интерфейсе.
  id: 713404098
  name: "Аренда Артромот — Поиск"
  # Классические текстово-графические кампании в этом аккаунте недоступны,
  # поэтому кампания заведена как Единая перфоманс-кампания.
  type: UNIFIED_PERFORMANCE

  # Оставлен только поиск: всё остальное в ЕПК включено по умолчанию и даёт
  # нецелевой трафик на медицинскую тематику.
  placements:
    search: true
    product_gallery: false
    dynamic_places: false
    organizations_list: false
    ad_network: false
    maps: false

  strategy: "максимум кликов с ручными ставками"
  weekly_budget: 3500

  # Как в аккаунте: оба региона с областями, а не только города.
  # Область даёт клики и конверсии — Химки, Королёв, Мытищи, Истра, Тверь.
  regions: [1, 10174]   # 1 — Москва и область, 10174 — СПб и Ленобласть

  calltracking: true
  attribution: "последний значимый переход кросс-девайс"
  metrika_counter: 103118341

  goals:
    - id: 594657447
      name: "Просмотр страницы аренды"
      value: 30
    - id: 594657549
      name: "Просмотр карточки аппарата"
      value: 100
    - id: 490492726
      name: "Клик по номеру телефона"
      value: 3000
    - id: 456684631
      name: "Отправил контактные данные"
      value: 3000

  utm: "utm_source=yandex&utm_medium=cpc&utm_campaign=arenda-poisk&utm_content={ad_id}&utm_term={keyword}"

  sitelinks:
    - title: "ARTROMOT K1 — колено"
      href: "https://orto-fit.ru/arenda-trenazherov/artromot-k1"
    - title: "Аппараты для плеча"
      href: "https://orto-fit.ru/arenda-trenazherov/ortorent-plecho"
    - title: "Голеностоп и стопа"
      href: "https://orto-fit.ru/arenda-trenazherov/ortorent-golenostop"
    - title: "Все аппараты в аренду"
      href: "https://orto-fit.ru/arenda-trenazherov"

  callouts:
    - "Работаем с 2018 года"
    - "Настройка при доставке"
    - "Доставка по Москве и СПб"

groups:
  - name: "Бренд"
    id: 5782883408
    max_cpc: 60
    # Кросс-минусовка: широкие брендовые фразы («артромот аренда») выигрывали
    # аукцион у суставных групп — 16 августа запрос «артромот для плечевого
    # сустава аренда» слово в слово совпал с фразой «Плеча», но ушёл сюда.
    # Минусы делают перехват невозможным физически. «Аппарат общее» намеренно
    # не минусуется: он страховка для запросов, не совпавших ни с одной группой.
    # Вложенный список разворачивается скриптом: якорь YAML не умеет
    # дополняться элементами, только подставляться целиком.
    negative_keywords:
      - *negatives
      - плечо
      - плечевой
      - локоть
      - локтевой
      - голеностоп
      - голеностопный
      - s3
      - сп3
      - sp3
      - е2
    autotargeting:
      target_queries: true        # целевые
      narrow_queries: true        # узкие
      own_brand_queries: true     # с упоминанием своего бренда
      broad_queries: false        # широкие
      accessory_queries: false    # сопутствующие
      alternative_queries: false  # альтернативные
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - артромот аренда -взять
      - artromot аренда -k1
      - артромот напрокат
      - аренда artromot k1
      - артромот взять в аренду
    ads:
      # Заголовки и тексты — массивы: Директ комбинирует их сам (до 7 и до 3).
      # В API это структура ResponsiveAd, доступная только в версии v501; поля
      # title2 не существует. Объявление опознаётся по первому заголовку,
      # менять его — значит завести новое объявление.
      - titles:
          - "Аренда ARTROMOT K1 — доставим сегодня"
          - "ARTROMOT K1 в аренду от 500 ₽/сутки"
          - "Артромот К1 — аренда в Москве и СПб"
        texts:
          - "Аппарат для разработки колена. Привезём, настроим, покажем как заниматься."
          - "Забронируйте аппарат заранее к дате операции или выписки."
        href: "https://orto-fit.ru/arenda-trenazherov/artromot-k1"
        price:
          value: 500
          prefix: "от"
          currency: RUB

  - name: "Аппарат общее"
    id: 5782891825
    max_cpc: 60
    negative_keywords: *negatives
    autotargeting:
      target_queries: true
      narrow_queries: true
      own_brand_queries: true
      broad_queries: false
      accessory_queries: false
      alternative_queries: false
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - аренда аппарата для разработки коленного сустава
      - взять аппарат для разработки колена
      - прокат аппарата механотерапии
      - аппарат для разработки сустава аренда -коленный
    ads:
      # «Подберём под ваш диагноз» читалось как медицинская рекомендация.
      - titles:
          - "Аппарат для разработки суставов — аренда"
          - "Аренда аппаратов для реабилитации"
          - "Аренда медицинского оборудования"
        texts:
          - "16 аппаратов: колено, плечо, локоть, кисть. Поможем с выбором модели."
          - "Работаем с 2018. Привезём и настроим. Оплата при получении аппарата."
        href: "https://orto-fit.ru/arenda-trenazherov"
        price:
          value: 500
          prefix: "от"
          currency: RUB

  - name: "Разработка колена"
    id: 5782895424
    max_cpc: 60
    negative_keywords: *negatives
    autotargeting:
      target_queries: true
      narrow_queries: true
      own_brand_queries: true
      broad_queries: false
      accessory_queries: false
      alternative_queries: false
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - аппарат для разработки колена аренда
      - тренажер для разгибания колена аренда
      - аппарат для сгибания колена в аренду
    ads:
      # «Не можете ехать в клинику?» создавало впечатление, что обращение
      # к врачу не требуется.
      - titles:
          - "Разработка колена дома — аренда аппарата"
          - "Аппарат для сгибания колена в аренду"
        texts:
          - "Восстановление дома по назначению врача. Привезём и настроим аппарат."
          - "Восстановление сразу после выписки. Доставим в день обращения."
        href: "https://orto-fit.ru/arenda-trenazherov/artromot-k1"
        price:
          value: 500
          prefix: "от"
          currency: RUB

  # Группы под суставы, кроме колена. Заведены после того, как автотаргетинг
  # 12 августа привёл запросы «артромот для плечевого сустава аренда» и
  # «аппарат локтевой для растяжки орторент аренда»: спрос есть, а посадочные
  # страницы под него в кампании не было — человек попадал на объявление
  # про колено.
  #
  # Объявления ведут на карточки Артромота: фразы называют конкретные модели
  # (S3, E2, SP3), и посадочная должна показывать именно их, а не аналог
  # Орторента.
  #
  # Цены сверены по этим же карточкам — минимальная суточная ставка при долгой
  # аренде. У плеча и локтя 600 ₽, у голеностопа 500 ₽. Совпали с ценами
  # Орторента, так что значения не менялись.
  - name: "Плечо"
    id: 5785929110
    max_cpc: 60
    negative_keywords: *negatives
    autotargeting:
      target_queries: true
      narrow_queries: true
      own_brand_queries: true
      broad_queries: false
      accessory_queries: false
      alternative_queries: false
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - артромот для плечевого сустава аренда
      - артромот s3 аренда
      - аппарат для разработки плечевого сустава аренда
      - аппарат для разработки плеча напрокат
    ads:
      # Вторые заголовок и текст досланы после создания: при создании 13 августа
      # они ушли полем title2, которого в ЕПК нет, и Директ их молча выбросил.
      - titles:
          - "Аренда аппарата для разработки плеча"
          - "Доставка и настройка"
        texts:
          - "Механотерапия плечевого сустава дома по назначению врача. Привезём и настроим."
          - "Восстановление сразу после выписки. Доставим в день обращения."
        href: "https://orto-fit.ru/arenda-trenazherov/artromot-s3"
        price:
          value: 600
          prefix: "от"
          currency: RUB

  - name: "Локоть"
    id: 5785929111
    max_cpc: 60
    negative_keywords: *negatives
    autotargeting:
      target_queries: true
      narrow_queries: true
      own_brand_queries: true
      broad_queries: false
      accessory_queries: false
      alternative_queries: false
      competitor_brand_queries: false
      no_brand_queries: false
    keywords:
      - артромот е2 аренда
      - artromot e2 аренда
      - артромот для локтевого сустава аренда
      - аппарат для разработки локтевого сустава аренда
      - аппарат для разработки локтя напрокат
    ads:
      - titles:
          - "Разработка локтевого сустава — аренда"
          - "Доставка и настройка"
        texts:
          - "Восстановление дома по назначению врача. Привезём и настроим аппарат."
          - "Восстановление сразу после выписки. Доставим в день обращения."
        href: "https://orto-fit.ru/arenda-trenazherov/artromot-e2-compact"
        price:
          value: 600
