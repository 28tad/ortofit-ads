# Кампания заведена в Директе вручную; здесь она описана для версионирования и
# для будущей записи через API. ID реальных объектов заданы полями id, а не
# комментариями: по ним скрипт сопоставляет описание с аккаунтом — из коммента
# он бы их не прочитал.
#
# Тексты подчинены требованиям Яндекса к рекламе медицинских изделий:
# https://yandex.ru/support/direct/ru/moderation/categories/medicine-medical-devices
# Предупреждение «Есть противопоказания. Посоветуйтесь с врачом» Директ
# добавляет в текстовые объявления сам — в тексты его вписывать не нужно.

# Общий список минус-фраз. В Единой перфоманс-кампании минус-фразы задаются на
# уровне группы, общего списка на кампанию нет — поэтому один и тот же набор
# подставляется в каждую группу якорем, а не дублируется трижды.
negative_keywords: &negatives
  - упражнения
  - гимнастика
  - лфк
  - зарядка
  - симптомы
  - лечение
  - болит
  - отек
  - мазь
  - уколы
  - таблетки
  - омс
  - квота
  - бесплатно
  - инвалидность
  - больничный
  - операция
  - артроскопия
  - эндопротезирование
  - хирург
  - клиника
  - больница
  - санаторий
  - отзывы
  - форум
  - stoller
  - мрт
  - протез
  - имплант
  - наколенник
  - ортез
  - костыли
  - диета
  - наркоз

campaign:
  # Сопоставление с аккаунтом идёт по id, а не по имени: Директ назвал кампанию
  # сам — «Единая перфоманс-кампания №2 от 09-08-2026», — и по имени скрипт её
  # не находил. Имя ниже желаемое; переименовать в интерфейсе.
  id: 713404098
  name: "Аренда Артромот — Поиск"
  # Классические текстово-графические кампании в этом аккаунте недоступны,
  # поэтому кампания заведена как Единая перфоманс-кампания.
  type: UNIFIED_PERFORMANCE

  # Оставлен только поиск: всё остальное в ЕПК включено по умолчанию и даёт
  # нецелевой трафик на медицинскую тематику.
  placements:
    search: true
    product_gallery: false
    dynamic_places: false
    organizations_list: false
    ad_network: false
    maps: false

  strategy: "максимум кликов с ручными ставками"
  weekly_budget: 3500

  regions: [213, 2]   # 213 — Москва, 2 — Санкт-Петербург

  calltracking: true
  attribution: "последний значимый переход кросс-девайс"
  metrika_counter: 103118341

  goals:
    - id: 594657447
      name: "Просмотр страницы аренды"
      value: 30
    - id: 594657549
      name: "Просмотр карточки аппарата"
      value: 100
    - id: 490492726
      name: "Клик по номеру телефона"
      value: 3000
    - id: 456684631
      name: "Отправил контактные данные"
      value: 3000

  utm: "utm_source=yandex&utm_medium=cpc&utm_campaign=arenda-poisk&utm_content={ad_id}&utm_term={keyword}"

  sitelinks:
    - title: "ARTROMOT K1 — колено"
      href: "https://orto-fit.ru/arenda-trenazherov/artromot-k1"
    - title: "Аппараты для плеча"
      href: "https://orto-fit.ru/arenda-trenazherov/ortorent-plecho"
    - title: "Голеностоп и стопа"
      href: "https://orto-fit.ru/arenda-trenazherov/ortorent-golenostop"
    - title: "Все аппараты в аренду"
      href: "https://orto-fit.ru/arenda-trenazherov"

  callouts:
    - "Работаем с 2018 года"
    - "Настройка при доставке"
    - "Доставка по Москве и СПб"

